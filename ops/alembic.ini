# Alembic configuration for tennis-prediction-bot.
# DB URL is supplied at runtime from env (DATABASE_URL) — never put a real
# URL here. Run from the repo root: `alembic -c ops/alembic.ini upgrade head`.

[alembic]
script_location = ../migrations
prepend_sys_path = ..
sqlalchemy.url =
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

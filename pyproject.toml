[project]
name = "tennis-prediction-bot"
version = "0.1.0"
description = "Multi-agent ATP tennis match prediction system."
requires-python = ">=3.12"
readme = "prompts.md"
authors = [{ name = "Andrew" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0.1",
    "httpx>=0.27",
    "tenacity>=8.4",
    "rapidfuzz>=3.9",
    "qdrant-client>=1.10",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "anthropic>=0.34",
    "voyageai>=0.2",
    "typer>=0.12",
    "rich>=13.7",
    "apscheduler>=3.10",
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "testcontainers[postgres]>=4.7",
]

[project.scripts]
tennis = "tennis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tennis"]

[tool.hatch.build.targets.sdist]
include = ["src", "migrations", "config", "ops", "tests"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "B", "SIM", "C4", "TCH",
    "T20", "RUF", "PL", "RET", "ARG",
]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PLR2004", "S101", "N806"]
"migrations/**" = ["T20", "N999"]
# ML convention: capital `X` design matrix / `X_train` etc. mirror the
# sklearn/xgboost/lightgbm public API names; lowercasing them hurts readability.
"src/tennis/models/**" = ["N803", "N806"]
# M1b: the modeling agent passes ML design matrices (`X_model`) into helpers,
# so the capital-`X` convention extends to N803 (argument names) here too.
"src/tennis/agents/modeling/**" = ["N803", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["xgboost.*", "lightgbm.*", "playwright.*", "apscheduler.*", "voyageai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --tb=short"
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests, no IO",
    "integration: requires postgres/qdrant",
    "e2e: full pipeline",
]

[tool.coverage.run]
source = ["src/tennis"]
branch = true
omit = ["src/tennis/cli.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
